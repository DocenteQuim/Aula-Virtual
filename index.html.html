<style>

    --chalk-2:#1E8C63;
    --paper:#FBF8F0;

    --ink:#232323;

  *{box-sizing:border-box;}
  #app{

    overflow:hidden;
    max-width:720px;
    margin:0 auto;
    box-shadow:0 1px 3px rgba(0,0,0,.08);

  .band{
    background:linear-gradient(180deg,var(--chalk),var(--chalk-2));
    color:var(--paper);
    padding:22px 20px 20px;
    position:relative;
  }

    content:"";

  }

  }

  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;

  .btn-primary:hover{background:var(--pen-dark);}

  th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-soft);border-bottom:1px solid var(--line);padding:6px 4px;}

  .code-box{font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:3px;font-weight:600;background:var(--chalk);color:var(--gold);padding:12px;border-radius:8px;text-align:center;margin:10px 0;}
  .qtext-view{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.4;}
  .exam-progress{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-bottom:14px;}
  .warn{background:#fdf0ea;border:1px solid #eecfbd;color:#8a4a1f;font-size:12px;padding:8px 10px;border-radius:7px;margin-bottom:12px;}
  .shared-note{font-size:11px;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:10px;margin-top:4px;}

  /* --- Recursos (tabla periódica + calculadora) --- */
  .fab-res{
    position:fixed;right:18px;bottom:18px;z-index:500;
    background:var(--pen);color:#fff;border:none;border-radius:24px;
    padding:11px 16px;font-family:'Inter',sans-serif;font-weight:700;font-size:12.5px;
    box-shadow:0 4px 10px rgba(0,0,0,.25);cursor:pointer;
  }

    position:absolute;inset:0;background:var(--paper-2);z-index:400;
    display:flex;flex-direction:column;

  .res-body{flex:1;overflow-y:auto;padding:14px 14px 60px;}
  .res-tabs{display:flex;gap:6px;margin-bottom:12px;}

  .pt-scroll{overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;}
  .pt-hint{font-size:11px;color:var(--ink-soft);margin:0 0 8px;}
  .ptable{display:grid;grid-template-columns:repeat(18,32px);grid-auto-rows:32px;gap:2px;width:max-content;}
  .pt-groupHead{
    display:flex;align-items:center;justify-content:center;

  .pt-cell{
    border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;

  .pt-cell.placeholder{font-family:'IBM Plex Mono',monospace;font-size:7px;text-align:center;line-height:1.1;}

  .pt-detail{
    margin-top:14px;border:1px solid var(--line);border-radius:9px;padding:12px;background:#fff;
  }
  .pt-detail .dname{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin:0 0 6px;}
  .pt-detail dl{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:0;font-size:12.5px;}
  .pt-detail dt{color:var(--ink-soft);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;font-family:'IBM Plex Mono',monospace;}
  .pt-detail dd{margin:0 0 4px;font-weight:600;}
  .pt-legend{margin-top:14px;}
  .pt-legend .lg-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;}
  .pt-legend .sw{width:16px;height:16px;border-radius:4px;flex-shrink:0;border:1px solid rgba(0,0,0,.1);}
  .pt-legend .lg-name{font-weight:600;}
  .pt-legend .lg-desc{color:var(--ink-soft);}
  .pt-search{margin-bottom:10px;}

  .calc{max-width:340px;margin:0 auto;}
  .calc-display{
    background:var(--chalk);color:var(--paper);border-radius:9px;padding:14px;margin-bottom:10px;text-align:right;
  }
  .calc-expr{font-family:'IBM Plex Mono',monospace;font-size:13px;opacity:.7;min-height:16px;word-break:break-all;}
  .calc-result{font-family:'Fraunces',serif;font-size:26px;font-weight:600;min-height:32px;}
  .calc-mode{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .calc-mode button{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--paper);cursor:pointer;}
  .calc-mode button.active{background:var(--gold);border-color:var(--gold);color:#3a2c07;font-weight:700;}
  .calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .calc-grid button{
    font-family:'Inter',sans-serif;font-weight:600;font-size:14px;padding:12px 2px;
    border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);
  }
  .calc-grid button.op{background:var(--paper-2);color:var(--pen);}
  .calc-grid button.fn{background:var(--paper-2);font-size:11.5px;}
  .calc-grid button.wide{grid-column:span 2;}
  .calc-grid button.ac{background:var(--chalk);color:var(--paper);}

  /* --- Bloques de contenido (texto/imagen/tabla) e imágenes en preguntas --- */
  .item-row{position:relative;margin-bottom:10px;}
  .item-order{display:flex;flex-direction:column;gap:2px;position:absolute;left:-2px;top:8px;z-index:2;}
  .item-order button{
    width:20px;height:18px;line-height:16px;padding:0;font-size:10px;border-radius:4px;
    border:1px solid var(--line);background:var(--paper);cursor:pointer;color:var(--ink-soft);
  }
  .bcard{
    border:1px dashed var(--gold);border-radius:9px;padding:12px 12px 12px 30px;background:#fffdf5;
  }
  .bcard .bhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .bcard .bhead .qtag{background:#fff3d6;border-color:var(--gold);}
  .bcard textarea{min-height:70px;}
  .img-thumb-wrap{position:relative;display:inline-block;margin:6px 0 10px;}
  .img-thumb-wrap img{max-width:100%;max-height:160px;border-radius:7px;border:1px solid var(--line);display:block;}
  .img-thumb-wrap .rm-img{
    position:absolute;top:-8px;right:-8px;background:var(--pen);color:#fff;border:2px solid #fff;
    border-radius:50%;width:22px;height:22px;line-height:18px;text-align:center;cursor:pointer;font-size:13px;
  }
  .upload-btn{
    display:inline-block;font-size:12px;font-weight:600;padding:7px 12px;border-radius:7px;

  .upload-btn input{display:none;}
  .mini-table{width:100%;border-collapse:collapse;font-size:11.5px;margin:6px 0 4px;}

  .add-item-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .qtext-view img, .bcard img{max-width:100%;border-radius:7px;}

  /* --- Config. de examen: tiempo, aleatorio, bloqueo --- */
  .exam-config{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
  .exam-config .row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;}
  .exam-config .row input[type=number]{width:80px;margin:0;}
  .switch{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider{position:absolute;inset:0;background:var(--line);border-radius:22px;cursor:pointer;transition:.15s;}
  .switch .slider::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
  .switch input:checked + .slider{background:var(--ok);}
  .switch input:checked + .slider::before{transform:translateX(18px);}

  .exam-timer{
    position:sticky;top:0;z-index:5;background:var(--chalk);color:var(--gold);

  .lock-overlay .countdown{font-family:'IBM Plex Mono',monospace;font-size:36px;color:var(--gold);font-weight:700;}

  /* --- Retroalimentación --- */
  .fb-card{border-radius:9px;padding:12px;margin-bottom:10px;border:1px solid var(--line);background:#fff;}
  .fb-card.ok{border-left:5px solid var(--ok);}
  .fb-card.bad{border-left:5px solid var(--pen);}
  .fb-card.manual{border-left:5px solid var(--gold);}
  .fb-status{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}

  .fb-status.bad{color:var(--pen);}
  .fb-status.manual{color:#8a6a1f;}
  .fb-answer{font-size:12.5px;margin:3px 0;}

  .fb-retro{font-size:12px;background:var(--paper-2);border-radius:6px;padding:7px 9px;margin-top:6px;color:var(--ink-soft);}

  /* --- Modal de confirmación propio (reemplaza confirm() nativo, bloqueado en iframes) --- */
  .confirm-overlay{
    position:absolute;inset:0;z-index:800;background:rgba(20,30,25,.55);
    display:flex;align-items:center;justify-content:center;padding:20px;

    background:#fff;border-radius:12px;padding:20px;max-width:320px;width:100%;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
  }
  .confirm-box h2{font-family:'Fraunces',serif;font-size:17px;margin:0 0 8px;}
  .confirm-box p{font-size:13.5px;color:var(--ink-soft);margin:0 0 16px;line-height:1.4;}
  .confirm-box .row{display:flex;gap:8px;}
  .confirm-box .row button{flex:1;padding:11px;}

  /* --- Opciones editables (agregar/quitar) --- */
  .opt-row label.optlbl{display:flex;align-items:center;gap:8px;flex:1;cursor:pointer;}
  .rm-opt{cursor:pointer;color:var(--ink-soft);font-size:17px;padding:2px 6px;flex-shrink:0;}
  .add-opt-btn{font-size:12px;padding:6px 12px;margin-top:2px;}

  /* --- Navegación de examen por pestañas (una pregunta a la vez) --- */
  .q-progress-bar{height:8px;border-radius:5px;background:var(--paper-2);overflow:hidden;margin:10px 0 6px;}
  .q-progress-fill{height:100%;background:var(--pen);border-radius:5px;transition:width .2s;}
  .q-progress-label{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);text-align:center;margin:0 0 10px;}
  .q-dots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:14px;}
  .q-dots button{
    width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;cursor:pointer;color:var(--ink-soft);
  }
  .q-dots button.done{background:#e3f1e7;border-color:var(--ok);color:var(--ok);}
  .q-dots button.current{background:var(--chalk);border-color:var(--chalk);color:#fff;}
  .q-nav{display:flex;gap:10px;margin-top:6px;}
  .q-nav button{flex:1;padding:14px 8px;font-size:14.5px;}
  .q-nav button:disabled{opacity:.35;cursor:not-allowed;}
</style>

(function(){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // ---------- Tabla periódica: datos ----------
  // [z, símbolo, nombre, periodo, grupo_moderno(0=lantánido/actínido), electronegatividad(Pauling|null), familia]

  // ---------- orden de presentación: aleatoriza "unidades" (un bloque + sus preguntas viajan juntos) ----------
  function buildDisplayItems(exam){
    const items = (exam.items && exam.items.length) ? exam.items.slice() : exam.preguntas.map(q=>({type:'q', qid:q.id}));
    if(!exam.aleatorio) return items;
    const units = [];
    let openUnit = null;
    items.forEach(it=>{
      if(it.type==='bloque'){
        openUnit = [it];
        units.push(openUnit);
      } else if(openUnit){
        openUnit.push(it);
      } else {
        units.push([it]);
      }
    });
    for(let i=units.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [units[i],units[j]] = [units[j],units[i]];
    }
    return units.flat();
  }

  // Arma las "páginas" de navegación: un bloque de texto/imagen/tabla queda fijo
  // y se repite en todas las preguntas que le siguen, hasta el próximo bloque.
  function buildPages(items, exam){
    const pages = [];
    let currentBlock = null;
    let num = 0;
    items.forEach(it=>{
      if(it.type==='bloque'){
        currentBlock = (exam.bloques||[]).find(x=>x.id===it.id) || null;
      } else {
        const q = exam.preguntas.find(x=>x.id===it.qid);
        if(q){ num++; pages.push({ q, block: currentBlock, num }); }
      }
    });
    return pages;
  }

  // ---------- imágenes: leer archivo y comprimir/redimensionar a dataURL ----------
  function fileToResizedDataURL(file, maxDim, quality){
    maxDim = maxDim || 900; quality = quality || 0.82;
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('read error'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('img error'));
        img.onload = () => {
          let w = img.width, h = img.height;
          if(w > maxDim || h > maxDim){
            const scale = maxDim / Math.max(w,h);
            w = Math.round(w*scale); h = Math.round(h*scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  const REMOTE_DB_URL = 'https://script.google.com/macros/s/AKfycbwAH1czMqm9DYk_tn4J_cY2O3Llbhv-D5FphCVqceeD3kTq-xkKM-X4iyV475V7gCPb/exec';

  async function remoteCall(action, params){
    if(!REMOTE_DB_URL) throw new Error('Backend remoto no configurado (REMOTE_DB_URL vacío).');
    const res = await fetch(REMOTE_DB_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight CORS
      body: JSON.stringify({ action, ...params })
    });
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || 'Error remoto desconocido');
    return json.result;
  }

  const DB = {

      if(window.storage) return window.storage.get(key, shared);
      return remoteCall('kv_get', {key});

    async set(key, value, shared){
      if(window.storage) return window.storage.set(key, value, shared);
      return remoteCall('kv_set', {key, value});

    async delete(key, shared){
      if(window.storage) return window.storage.delete(key, shared);
      return remoteCall('kv_delete', {key});
    },
    async list(prefix, shared){
      if(window.storage) return window.storage.list(prefix, shared);
      return remoteCall('kv_list', {prefix});
    }
  };

  // ---------- PDF extraction + heuristic parsing ----------
  async function extractPdfText(file){
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data:buf}).promise;
    let fullText='';
    for(let i=1;i<=pdf.numPages;i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      let lastY=null, line='';
      for(const item of content.items){
        const y = item.transform[5];
        if(lastY!==null && Math.abs(y-lastY)>2){
          fullText += line.trim()+'\n';
          line='';
        }
        line += item.str+' ';
        lastY=y;
      }
      fullText += line.trim()+'\n';
    }
    return fullText;
  }

  function parseExamText(text){
    const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
    const qStart = /^(\d{1,3})[\.\)\-]\s+(.+)/;
    const optStart = /^([a-dA-D])[\.\)]\s+(.+)/;
    const blocks=[]; let current=null;
    for(const line of lines){
      const qm = line.match(qStart);
      if(qm){
        if(current) blocks.push(current);
        current = { texto: qm[2], opciones: [] };
      } else if(current){
        const om = line.match(optStart);
        if(om){
          current.opciones.push({ letra: om[1].toUpperCase(), texto: om[2] });
        } else if(current.opciones.length===0){
          current.texto += ' ' + line;
        } else {
          current.opciones[current.opciones.length-1].texto += ' ' + line;
        }
      }
    }
    if(current) blocks.push(current);

    return blocks.map((b,idx)=>{
      let tipo='abierta', opciones=b.opciones;
      const up = b.texto.toUpperCase();
      const hasV = opciones.some(o=>/VERDADERO/.test(o.texto.toUpperCase()));
      const hasF = opciones.some(o=>/FALSO/.test(o.texto.toUpperCase()));
      if(opciones.length===2 && hasV && hasF){
        tipo='vf';
        opciones = [{letra:'V',texto:'Verdadero'},{letra:'F',texto:'Falso'}];
      } else if(opciones.length>=2){
        tipo='opcion_multiple';
      } else if(/\(\s*V\s*\/\s*F\s*\)/.test(b.texto) || /VERDADERO\s*O\s*FALSO/.test(up)){
        tipo='vf';
        opciones=[{letra:'V',texto:'Verdadero'},{letra:'F',texto:'Falso'}];
      }
      return {
        id: 'q'+(idx+1)+'_'+uid(),
        texto: b.texto.trim(),
        tipo,
        opciones,
        correcta: null,
        aceptadas: [],
        imagen: null,
        retro: ''
      };
    });
  }

  // ---------- grading ----------
  function gradeExam(exam, respuestas){
    let correctas=0;
    exam.preguntas.forEach(p=>{
      const r = respuestas[p.id];
      if(p.tipo==='opcion_multiple' || p.tipo==='vf'){
        if(r && p.correcta && r===p.correcta) correctas++;
      } else if(p.tipo==='abierta'){
        if(r && p.aceptadas && p.aceptadas.length){
          const rn = r.trim().toLowerCase();
          if(p.aceptadas.some(a=>a.trim().toLowerCase()===rn)) correctas++;
        }
      }

    return `

          <p>${esc(c.message)}</p>
          <div class="row">

            <button class="btn btn-primary" onclick="AV.confirmYes()">Sí, continuar</button>
          </div>
        </div>

  function lockOverlay(){
    return `
      <div class="lock-overlay">
        <div>
          <div class="lo-emoji">⚠️</div>
          <h2>Saliste de la pestaña del examen</h2>
          <p>Esta es tu única advertencia. Si vuelve a ocurrir, el examen se entregará automáticamente.</p>

  function viewResources(){
    return `
      <div class="res-overlay">
        <div class="res-head">
          <h2>Recursos · para cualquier prueba</h2>
          <button onclick="AV.closeResources()">Cerrar ✕</button>
        </div>
        <div class="res-body">
          <div class="res-tabs">
            <button class="tab-btn ${state.resourceTab==='tabla'?'active':''}" onclick="AV.setResourceTab('tabla')">Tabla periódica</button>
            <button class="tab-btn ${state.resourceTab==='calc'?'active':''}" onclick="AV.setResourceTab('calc')">Calculadora científica</button>
          </div>
          ${state.resourceTab==='tabla' ? periodicTableHTML() : calculatorHTML()}
        </div>
      </div>
    `;
  }

  function periodicTableHTML(){
    const search = state.ptSearch.trim().toLowerCase();
    function matches(e){
      if(!search) return true;
      return e.sym.toLowerCase().includes(search) || e.name.toLowerCase().includes(search) || String(e.z)===search;
    }
    function cellClass(e){
      let c='pt-cell';
      if(search){ c += matches(e) ? ' hl' : ' dim'; }
      return c;
    }
    function cellStyle(e){ return `background:${FAM_META[e.fam].color};grid-column:${e.group};grid-row:${e.period+1};`; }
    function cellHTML(e){
      return `<div class="${cellClass(e)}" style="${cellStyle(e)}" onclick="AV.selectElement(${e.z})">
        <span class="z">${e.z}</span>
        <span class="sym">${e.sym}</span>
        <span class="en">${e.en!=null?e.en.toFixed(2):'—'}</span>
      </div>`;
    }
    const mainEls = ELEMENTS.filter(e=>e.fam!=='lant' && e.fam!=='act');
    const lantEls = ELEMENTS.filter(e=>e.fam==='lant');
    const actEls = ELEMENTS.filter(e=>e.fam==='act');

    let grid = `<div class="ptable">`;
    for(let g=1; g<=18; g++){
      grid += `<div class="pt-groupHead" style="grid-column:${g};grid-row:1;">${GROUP_ROMAN[g]}</div>`;
    }
    grid += mainEls.map(cellHTML).join('');
    grid += `<div class="pt-cell placeholder" style="background:${FAM_META.lant.color};grid-column:3;grid-row:7;">57-71<br>La-Lu</div>`;
    grid += `<div class="pt-cell placeholder" style="background:${FAM_META.act.color};grid-column:3;grid-row:8;">89-103<br>Ac-Lr</div>`;
    grid += `</div>`;

    function fRow(list){
      return `<div class="ptable" style="grid-template-columns:repeat(15,32px);">` +
        list.map((e,i)=>`<div class="${cellClass(e)}" style="background:${FAM_META[e.fam].color};grid-column:${i+1};grid-row:1;" onclick="AV.selectElement(${e.z})">
          <span class="z">${e.z}</span><span class="sym">${e.sym}</span><span class="en">${e.en!=null?e.en.toFixed(2):'—'}</span>
        </div>`).join('') + `</div>`;
    }

    const sel = state.selectedElement ? ELEMENTS.find(e=>e.z===state.selectedElement) : null;

    return `
      <input class="pt-search" type="text" placeholder="Buscar por símbolo, nombre o número atómico…" value="${esc(state.ptSearch)}" oninput="AV.setPtSearch(this.value)">
      <p class="pt-hint">Desliza hacia los lados para ver la tabla completa. Toca un elemento para ver su ficha.</p>
      <div class="pt-scroll">${grid}</div>
      <div class="pt-fblock">
        <div class="flabel">LANTÁNIDOS (57–71)</div>
        <div class="pt-scroll">${fRow(lantEls)}</div>
      </div>
      <div class="pt-fblock">
        <div class="flabel">ACTÍNIDOS (89–103)</div>
        <div class="pt-scroll">${fRow(actEls)}</div>
      </div>

      ${sel ? `
      <div class="pt-detail">
        <p class="dname">${sel.name} (${sel.sym})</p>
        <dl>
          <dt>Número atómico</dt><dd>${sel.z}</dd>
          <dt>Periodo</dt><dd>${sel.period}</dd>
          <dt>Grupo</dt><dd>${romanGroup(sel)}</dd>
          <dt>Familia</dt><dd>${FAM_META[sel.fam].label}</dd>
          <dt>Electronegatividad</dt><dd>${sel.en!=null?sel.en.toFixed(2):'No definida'}</dd>
        </dl>
      </div>` : ''}

      <div class="pt-legend">
        <h2 class="section-title" style="font-size:14px;">Familias y su significado</h2>
        ${Object.values(FAM_META).map(f=>`
          <div class="lg-row"><div class="sw" style="background:${f.color};"></div>
            <div><div class="lg-name">${f.label}</div><div class="lg-desc">${f.desc}</div></div>
          </div>`).join('')}
      </div>
    `;
  }

  function calculatorHTML(){
    const c = state.calc;
    const btn = (label, token, cls) => `<button class="${cls||''}" onclick="AV.calcPress('${token}')">${label}</button>`;
    return `
      <div class="calc">
        <div class="calc-mode">
          <span class="muted" style="margin:0;">Modo angular</span>
          <span>
            <button class="${c.deg?'active':''}" onclick="AV.calcSetDeg(true)">DEG</button>
            <button class="${!c.deg?'active':''}" onclick="AV.calcSetDeg(false)">RAD</button>
          </span>
        </div>
        <div class="calc-display">
          <div class="calc-expr">${esc(c.expr)||'&nbsp;'}</div>
          <div class="calc-result">${c.result!=null?c.result:'0'}</div>
        </div>
        <div class="calc-grid">
          ${btn('sin','sin(','fn')} ${btn('cos','cos(','fn')} ${btn('tan','tan(','fn')} ${btn('π','pi','fn')}
          ${btn('log','log(','fn')} ${btn('ln','ln(','fn')} ${btn('√','sqrt(','fn')} ${btn('e','e','fn')}
          ${btn('(', '(','fn')} ${btn(')', ')','fn')} ${btn('x²','^2','fn')} ${btn('xʸ','^','fn')}
          ${btn('AC','AC','ac')} ${btn('DEL','DEL','op')} ${btn('%','%','op')} ${btn('÷','/','op')}
          ${btn('7','7')} ${btn('8','8')} ${btn('9','9')} ${btn('×','*','op')}
          ${btn('4','4')} ${btn('5','5')} ${btn('6','6')} ${btn('-','-','op')}
          ${btn('1','1')} ${btn('2','2')} ${btn('3','3')} ${btn('+','+','op')}
          ${btn('0','0','wide')} ${btn('.','.')} ${btn('=','=','op')}
        </div>
      </div>
    `;
  }

  function sessionPill(){
    if(state.view==='login') return '';
    let label='';
    if(state.view==='teacherDash') label = 'Docente · '+esc(state.teacherName||'Sin nombre');
    if(state.view==='studentExam' || state.view==='studentResult') label = 'Estudiante · '+esc(state.studentForm.nombre);
    return `<div class="session-pill"><span>${label}</span><button onclick="AV.logout()">Salir</button></div>`;
  }

  function viewLogin(){
    if(!state.teacherGateOpen){
      return `
        ${loginEstudiante()}
      `;
    }
    return `
      ${loginDocente()}
    `;
  }

  function loginDocente(){
    return `

        <h2 class="section-title">Acceso estudiante</h2>

  function viewTeacherDash(){
    const tabs = [['crear','Crear examen'],['examenes','Mis exámenes'],['basedatos','Base de datos']];

      <div class="tabs">

      ${state.teacherTab==='crear' ? tabCrear() : ''}
      ${state.teacherTab==='examenes' ? tabExamenes() : ''}
      ${state.teacherTab==='basedatos' ? tabBaseDatos() : ''}
      ${state.teacherTab==='resultados' ? tabResultados() : ''}
    `;
  }

  function tabCrear(){
    if(state.loading){
      return `<div class="card empty">Leyendo el PDF y detectando preguntas…</div>`;
    }
    if(!state.parsed){
      return `
        <div class="card">
          <h2 class="section-title">1. Sube el examen en PDF</h2>
          <p class="muted">Funciona mejor si las preguntas están numeradas (1. 2. 3…) y, en opción múltiple, las alternativas usan a) b) c) d).</p>
          <input type="file" id="pdfInput" accept="application/pdf" onchange="AV.handlePdf(event)">
          <p class="muted" style="margin-top:10px;">También puedes empezar desde cero:</p>
          <button class="btn btn-outline btn-sm" onclick="AV.startBlank()">+ Crear examen en blanco</button>
        </div>
      `;
    }
    const p = state.parsed;
    let qNum = 0;
    const itemsHtml = p.items.map((it, idx) => {
      const orderCtrl = `
        <div class="item-order">
          <button ${idx===0?'disabled':''} onclick="AV.moveItem(${idx},-1)" title="Subir">▲</button>
          <button ${idx===p.items.length-1?'disabled':''} onclick="AV.moveItem(${idx},1)" title="Bajar">▼</button>

        const q = p.preguntas.find(x=>x.id===it.qid);
        return `<div class="item-row">${orderCtrl}${qEditCard(q, qNum-1)}</div>`;

            <input type="number" min="0" value="${p.tiempoLimite||0}" oninput="AV.setParsedField('tiempoLimite', parseInt(this.value)||0)">

          <div class="row">
            <span>🔀 Aleatorizar el orden de las preguntas</span>
            <label class="switch"><input type="checkbox" ${p.aleatorio?'checked':''} onchange="AV.setParsedField('aleatorio', this.checked)"><span class="slider"></span></label>
          </div>
          <div class="row">

            <label class="switch"><input type="checkbox" ${p.bloqueoPestana?'checked':''} onchange="AV.setParsedField('bloqueoPestana', this.checked)"><span class="slider"></span></label>
          </div>
        </div>
        <p class="muted" style="margin-top:10px;">💡 Puedes escribir fórmulas científicas con $...$, por ejemplo <code>$H_2O$</code> o <code>$x^2+y^2=z^2$</code>, en el texto de preguntas y bloques.</p>
      </div>
      <div class="card">
        <h2 class="section-title">3. Revisa el contenido (${p.preguntas.length} preguntas)</h2>
        <p class="muted">Marca la respuesta correcta de cada pregunta. Usa ▲▼ para reordenar. Puedes intercalar bloques de texto, imagen o tabla (por ejemplo, una lectura que aplique a varias preguntas).</p>
        ${itemsHtml || '<div class="empty">Sin contenido todavía.</div>'}
        <div class="add-item-row">
          <button class="btn btn-outline btn-sm" onclick="AV.addQuestion()">+ Agregar pregunta</button>
          <button class="btn btn-outline btn-sm" onclick="AV.addBlock()">+ Agregar bloque (texto / imagen / tabla)</button>

  function qEditCard(q, i){
    let body='';
    if(q.tipo==='opcion_multiple'){
      body = q.opciones.map((o,oi)=>`
        <div class="opt-row">
          <input type="radio" name="correcta_${q.id}" ${q.correcta===o.letra?'checked':''} onchange="AV.setCorrecta('${q.id}','${o.letra}')">
          <span class="qtag">${o.letra}</span>
          <input type="text" value="${esc(o.texto)}" oninput="AV.setOptionText('${q.id}',${oi},this.value)">
          ${q.opciones.length>2 ? `<span class="rm-opt" onclick="AV.removeOption('${q.id}','${o.letra}')" title="Quitar opción">&times;</span>` : ''}
        </div>`).join('') + (q.opciones.length<8 ? `<button class="btn btn-outline btn-sm add-opt-btn" onclick="AV.addOption('${q.id}')">+ Agregar opción</button>` : '');
    } else if(q.tipo==='vf'){
      body = `
        <div class="opt-row"><input type="radio" name="correcta_${q.id}" ${q.correcta==='V'?'checked':''} onchange="AV.setCorrecta('${q.id}','V')"><span>Verdadero</span></div>
        <div class="opt-row"><input type="radio" name="correcta_${q.id}" ${q.correcta==='F'?'checked':''} onchange="AV.setCorrecta('${q.id}','F')"><span>Falso</span></div>
      `;
    } else {
      body = `
        <label style="margin-top:4px;">Respuesta(s) aceptada(s), separadas por coma</label>
        <input type="text" value="${esc((q.aceptadas||[]).join(', '))}" oninput="AV.setAceptadas('${q.id}', this.value)" placeholder="Ej. fotosíntesis, proceso de fotosíntesis">
      `;
    }
    const imgHtml = q.imagen ? `
      <div class="img-thumb-wrap">
        <img src="${q.imagen}">
        <span class="rm-img" onclick="AV.removeQuestionImage('${q.id}')" title="Quitar imagen">&times;</span>
      </div>` : `
      <label class="upload-btn">📷 Adjuntar imagen a esta pregunta
        <input type="file" accept="image/*" onchange="AV.handleQuestionImage('${q.id}', event)">
      </label>`;
    return `
      <div class="qcard">
        <div class="qhead">
          <span class="qtag">${i+1} · ${q.tipo==='opcion_multiple'?'Opción múltiple':q.tipo==='vf'?'Verdadero/Falso':'Respuesta abierta'}</span>

              <option value="vf" ${q.tipo==='vf'?'selected':''}>Verdadero/Falso</option>
              <option value="abierta" ${q.tipo==='abierta'?'selected':''}>Abierta</option>
            </select>
            <span class="icon-x" onclick="AV.removeQuestion('${q.id}')" title="Eliminar">&times;</span>
          </div>
        </div>
        <textarea oninput="AV.setQText('${q.id}', this.value)">${esc(q.texto)}</textarea>
        ${imgHtml}
        ${body}
        <label style="margin-top:8px;">Retroalimentación (opcional) — se muestra al estudiante después de calificar</label>
        <textarea oninput="AV.setQRetro('${q.id}', this.value)" placeholder="Ej. Recuerda que el número atómico indica la cantidad de protones.">${esc(q.retro||'')}</textarea>
      </div>
    `;
  }

  function viewStudentExam(){
    const exam = state.activeExam;
    const pages = state.examPages || [];
    const idx = Math.min(state.examPageIndex||0, Math.max(pages.length-1,0));
    const page = pages[idx];
    const answered = Object.keys(state.respuestas).filter(k=>state.respuestas[k]!==''&&state.respuestas[k]!=null).length;
    const total = pages.length;
    const pct = total ? Math.round(((idx+1)/total)*100) : 0;

    const dots = pages.map((p,i)=>{
      const val = state.respuestas[p.q.id];
      const isAnswered = val!==undefined && val!==null && val!=='';
      const cls = i===idx ? 'current' : (isAnswered ? 'done' : '');
      return `<button class="${cls}" onclick="AV.goToPage(${i})">${i+1}</button>`;
    }).join('');

    const isLast = idx===total-1;

    return `
      <div class="card">
        ${exam.tiempoLimite ? `<div class="exam-timer">⏱ <span id="examTimerText">${formatTime(state.examTimer.remaining||exam.tiempoLimite*60)}</span></div>` : ''}
        <h2 class="section-title">${esc(exam.titulo)}</h2>
        <p class="muted">${esc(exam.curso)}</p>
        ${exam.bloqueoPestana ? `<div class="lock-notice">🔒 Este examen bloquea el cambio de pestaña/ventana. Evita salir de aquí hasta entregar.</div>` : ''}

        <div class="q-progress-bar"><div class="q-progress-fill" style="width:${pct}%;"></div></div>
        <p class="q-progress-label">Pregunta ${idx+1} de ${total} · ${answered} respondidas</p>
        <div class="q-dots">${dots}</div>

        ${page && page.block ? blockViewCard(page.block) : ''}
        ${page ? studentQ(page.q, page.num-1) : '<div class="empty">Este examen no tiene preguntas.</div>'}

        <div class="q-nav">
          <button class="btn btn-outline" ${idx===0?'disabled':''} onclick="AV.prevPage()">← Anterior</button>
          ${isLast
            ? `<button class="btn btn-primary" onclick="AV.confirmSubmit()">✅ Entregar examen</button>`
            : `<button class="btn btn-primary" onclick="AV.nextPage()">Siguiente →</button>`}
        </div>
        ${!isLast ? `<button class="btn btn-outline btn-block" style="margin-top:8px;font-size:12px;" onclick="AV.confirmSubmit()">Entregar examen ahora</button>` : ''}
      </div>
    `;
  }

  function viewStudentResult(){
    const r = state.lastResult;
    const exam = state.activeExam;
    const items = state.examDisplayItems || exam.preguntas.map(q=>({type:'q', qid:q.id}));

      <div class="card">
        <button class="btn btn-outline btn-block" onclick="AV.logout()">Finalizar</button>
      </div>
    `;

  function feedbackCard(q, num){
    const given = state.respuestas[q.id];
    let status, statusLabel, answerHtml;
    if(q.tipo==='opcion_multiple' || q.tipo==='vf'){
      const hasCorrecta = !!q.correcta;
      const isCorrect = hasCorrecta && given===q.correcta;
      status = !hasCorrecta ? 'manual' : (isCorrect ? 'ok' : 'bad');
      statusLabel = !hasCorrecta ? 'Sin clave definida' : (isCorrect ? '✓ Correcta' : '✗ Incorrecta');
      const givenText = q.tipo==='vf'
        ? (given==='V'?'Verdadero':given==='F'?'Falso':'Sin responder')
        : (given ? given+') '+((q.opciones.find(o=>o.letra===given)||{}).texto||'') : 'Sin responder');
      answerHtml = `<div class="fb-answer">Tu respuesta: <b>${esc(givenText)}</b></div>`;
      if(hasCorrecta && !isCorrect){
        const correctText = q.tipo==='vf'
          ? (q.correcta==='V'?'Verdadero':'Falso')
          : q.correcta+') '+((q.opciones.find(o=>o.letra===q.correcta)||{}).texto||'');
        answerHtml += `<div class="fb-answer">Respuesta correcta: <b>${esc(correctText)}</b></div>`;
      }
    } else {
      const hasAceptadas = q.aceptadas && q.aceptadas.length;
      const rn = (given||'').trim().toLowerCase();
      const isCorrect = hasAceptadas && q.aceptadas.some(a=>a.trim().toLowerCase()===rn);
      status = !hasAceptadas ? 'manual' : (isCorrect ? 'ok' : 'bad');
      statusLabel = !hasAceptadas ? 'Revisión manual del docente' : (isCorrect ? '✓ Correcta' : '✗ Incorrecta');
      answerHtml = `<div class="fb-answer">Tu respuesta: <b>${esc(given||'Sin responder')}</b></div>`;
      if(hasAceptadas && !isCorrect){
        answerHtml += `<div class="fb-answer">Respuesta(s) esperada(s): <b>${esc(q.aceptadas.join(', '))}</b></div>`;
      }
    }
    const imgHtml = q.imagen ? `<img src="${q.imagen}" style="max-width:100%;border-radius:7px;margin:6px 0;">` : '';
    const retroHtml = q.retro ? `<div class="fb-retro">💡 ${esc(q.retro)}</div>` : '';
    return `
      <div class="fb-card ${status}">
        <div class="fb-status ${status}">${num}. ${statusLabel}</div>
        <div class="qtext-view" style="font-size:13.5px;margin-bottom:6px;">${esc(q.texto)}</div>
        ${imgHtml}
        ${answerHtml}
        ${retroHtml}
      </div>
    `;
  }

        brandTapTimes = [];

        render();

      if(!name){ toast('Escribe tu nombre completo.'); return; }

      if(enteredHash !== TEACHER_PASSCODE_HASH){ toast('Clave de acceso incorrecta.'); return; }
      state.teacherName = name;
      state.view='teacherDash';
      state.teacherTab='crear';
      state.teacherGateOpen=false;
      render();
      this.refreshExamList();
    },

    async enterStudent(){
      const nombre = document.getElementById('sName').value.trim();
      const grado = document.getElementById('sGrado').value.trim();
      const codigo = document.getElementById('sCode').value.trim().toUpperCase();
      if(!nombre || !grado || !codigo){ toast('Completa todos los campos.'); return; }
      toast('Buscando examen…');
      const exam = await loadExamByCode(codigo);
      if(!exam){ toast('No se encontró ningún examen con ese código.'); return; }
      state.studentForm = {nombre, grado, codigo};
      state.activeExam = exam;
      state.respuestas = {};
      state.examDisplayItems = buildDisplayItems(exam);
      state.examPages = buildPages(state.examDisplayItems, exam);
      state.examPageIndex = 0;
      state.examLock = { violations:0, locked:false, countdown:0, intervalId:null };
      state.examTimer = { remaining:0, intervalId:null };
      state.view='studentExam';
      render();
      this.startExamTimer();
    },

    goToPage(i){
      if(!state.examPages.length) return;
      state.examPageIndex = Math.max(0, Math.min(i, state.examPages.length-1));
      render();
    },
    nextPage(){ this.goToPage(state.examPageIndex+1); },
    prevPage(){ this.goToPage(state.examPageIndex-1); },

    confirmSubmit(){
      const total = state.activeExam.preguntas.length;
      const answered = Object.keys(state.respuestas).filter(k=>state.respuestas[k]!==''&&state.respuestas[k]!=null).length;
      if(answered < total){
        this.showConfirm(
          '¿Entregar examen?',
          'Te faltan '+(total-answered)+' pregunta(s) por responder. ¿Seguro que quieres entregar ahora?',
          () => this.submitExam()
        );
      } else {
        this.showConfirm(
          '¿Entregar examen?',
          '¿Seguro que quieres entregar tus respuestas? No podrás cambiarlas después.',
          () => this.submitExam()
        );
      }
    },

    logout(){
      this.stopExamTimer();
      this.stopLockTimer();
      state.view='login';
      state.parsed=null;
      state.activeExam=null;
      state.respuestas={};
      state.examDisplayItems=null;
      state.examPages=[];
      state.examPageIndex=0;
      state.loginRole='estudiante';
      state.teacherGateOpen=false;
      render();
    },

    startExamTimer(){
      const exam = state.activeExam;
      if(!exam || !exam.tiempoLimite){ return; }
      state.examTimer.remaining = exam.tiempoLimite*60;
      clearInterval(state.examTimer.intervalId);
      state.examTimer.intervalId = setInterval(()=>{
        state.examTimer.remaining--;
        const el2 = document.getElementById('examTimerText');
        if(el2){
          el2.textContent = formatTime(Math.max(state.examTimer.remaining,0));
          el2.parentElement.style.color = state.examTimer.remaining<=60 ? '#ff9d8a' : '';
        }
        if(state.examTimer.remaining<=0){
          clearInterval(state.examTimer.intervalId);
          toast('Tiempo agotado. Entregando examen…');
          this.submitExam(true,'tiempo_agotado');
        }
      },1000);
    },
    stopExamTimer(){ clearInterval(state.examTimer.intervalId); },

    registerTabViolation(){
      const lock = state.examLock;
      lock.violations++;
      if(lock.violations===1){
        lock.locked=true;
        lock.countdown=15;
        render();
        clearInterval(lock.intervalId);
        lock.intervalId = setInterval(()=>{
          lock.countdown--;
          if(lock.countdown<=0){
            clearInterval(lock.intervalId);
            lock.locked=false;
          }
          render();
        },1000);
      } else if(lock.violations>=2){
        this.stopLockTimer();
        lock.locked=false;
        toast('Examen finalizado automáticamente: se detectó una segunda salida de la pestaña.');
        this.submitExam(true,'bloqueo_pestana');
      }
    },
    stopLockTimer(){ clearInterval(state.examLock.intervalId); },

    setTeacherTab(tab){
      state.teacherTab=tab;
      render();
      if(tab==='examenes') this.refreshExamList();
      if(tab==='basedatos') this.refreshDb();
    },

    async refreshExamList(){
      state.examList = await listExams();
      if(state.teacherTab==='examenes') render();
    },

    async refreshDb(){
      const all = await listResultados();
      state.dbData = all;
      state.driveUrl = await getDriveUrl();
      if(state.teacherTab==='basedatos') render();
    },

    async saveDriveUrlNow(){
      const url = document.getElementById('driveUrlInput').value.trim();
      if(url && !url.startsWith('https://script.google.com/')){
        toast('Esa URL no parece ser de Google Apps Script. Revisa que termine en /exec.');
        return;
      }
      await setDriveUrl(url);
      state.driveUrl = url;
      toast(url ? 'URL de Drive guardada. ¡Ya está conectado!' : 'Se quitó la conexión con Drive.');
      render();
    },

    async syncAllToDrive(){
      const url = await getDriveUrl();
      if(!url){ toast('Primero guarda la URL de Google Apps Script.'); return; }
      const all = state.dbData.length ? state.dbData : await listResultados();
      if(!all.length){ toast('No hay resultados guardados para sincronizar.'); return; }
      toast('Sincronizando '+all.length+' resultado(s) con Drive…');
      let ok = 0;
      for(const r of all){
        const sent = await syncResultToDrive(r);
        if(sent) ok++;
      }
      toast('Listo: se enviaron '+ok+' de '+all.length+' resultado(s) a Drive.');
    },

    async handlePdf(ev){
      const file = ev.target.files[0];
      if(!file) return;
      state.loading=true; render();
      try{
        const text = await extractPdfText(file);
        const preguntas = parseExamText(text);
        if(preguntas.length===0){
          toast('No se detectaron preguntas numeradas. Prueba con "Agregar pregunta manual" o revisa el formato del PDF.');
        }
        state.parsed = {
          titulo: file.name.replace(/\.pdf$/i,''),
          curso: '',
          preguntas,
          bloques: [],
          items: preguntas.map(q=>({type:'q', qid:q.id})),
          tiempoLimite: 0,
          aleatorio: false,
          bloqueoPestana: true
        };
      }catch(e){
        toast('No se pudo leer el PDF. Verifica que no esté escaneado como imagen.');
      }
      state.loading=false;
      render();
    },

    startBlank(){
      state.parsed = {
        titulo:'Nuevo examen', curso:'', preguntas:[], bloques:[], items:[],
        tiempoLimite: 0, aleatorio: false, bloqueoPestana: true
      };
      render();
    },

    setParsedField(field, val){ state.parsed[field]=val; },
    setQText(id, val){ state.parsed.preguntas.find(q=>q.id===id).texto=val; },
    setOptionText(id, idx, val){ state.parsed.preguntas.find(q=>q.id===id).opciones[idx].texto=val; },
    setCorrecta(id, letra){ state.parsed.preguntas.find(q=>q.id===id).correcta=letra; },
    addOption(id){
      const q = state.parsed.preguntas.find(x=>x.id===id);
      if(q.opciones.length>=8){ toast('Máximo 8 opciones.'); return; }
      q.opciones.push({ letra:'?', texto:'' });
      relabelOptions(q);
      render();
    },
    removeOption(id, letra){
      const q = state.parsed.preguntas.find(x=>x.id===id);
      if(q.opciones.length<=2){ toast('Debe haber al menos 2 opciones.'); return; }
      q.opciones = q.opciones.filter(o=>o.letra!==letra);
      relabelOptions(q);
      render();
    },
    setAceptadas(id, val){ state.parsed.preguntas.find(q=>q.id===id).aceptadas = val.split(',').map(s=>s.trim()).filter(Boolean); },
    setQRetro(id, val){ state.parsed.preguntas.find(q=>q.id===id).retro = val; },
    setTipo(id, tipo){
      const q = state.parsed.preguntas.find(q=>q.id===id);
      q.tipo=tipo; q.correcta=null;
      if(tipo==='vf') q.opciones=[{letra:'V',texto:'Verdadero'},{letra:'F',texto:'Falso'}];
      if(tipo==='opcion_multiple' && q.opciones.length<2) q.opciones=[{letra:'A',texto:''},{letra:'B',texto:''}];
      render();
    },
    addQuestion(){
      const nq = {
        id:'q'+uid(), texto:'Nueva pregunta', tipo:'opcion_multiple',
        opciones:[{letra:'A',texto:''},{letra:'B',texto:''}], correcta:null, aceptadas:[], imagen:null, retro:''
      };
      state.parsed.preguntas.push(nq);
      state.parsed.items.push({type:'q', qid:nq.id});
      render();
    },
    removeQuestion(id){
      state.parsed.preguntas = state.parsed.preguntas.filter(q=>q.id!==id);
      state.parsed.items = state.parsed.items.filter(it => !(it.type==='q' && it.qid===id));
      render();
    },
    resetParsed(){ state.parsed=null; render(); },

    addBlock(){
      const nb = { id:'b'+uid(), titulo:'', texto:'', imagen:null, tabla:'' };
      state.parsed.bloques.push(nb);
      state.parsed.items.push({type:'bloque', id:nb.id});
      render();
    },
    removeBlock(id){
      state.parsed.bloques = state.parsed.bloques.filter(b=>b.id!==id);
      state.parsed.items = state.parsed.items.filter(it => !(it.type==='bloque' && it.id===id));
      render();
    },
    setBlockField(id, field, val){
      const b = state.parsed.bloques.find(x=>x.id===id);
      b[field] = val;
      if(field==='tabla') render(); // refresca la vista previa de la tabla
    },
    async handleBlockImage(id, ev){
      const file = ev.target.files[0];
      if(!file) return;
      toast('Procesando imagen…');
      try{
        const dataUrl = await fileToResizedDataURL(file);
        state.parsed.bloques.find(x=>x.id===id).imagen = dataUrl;
      }catch(e){ toast('No se pudo cargar la imagen.'); }
      render();
    },
    removeBlockImage(id){
      state.parsed.bloques.find(x=>x.id===id).imagen = null;
      render();
    },
    async handleQuestionImage(id, ev){
      const file = ev.target.files[0];
      if(!file) return;
      toast('Procesando imagen…');
      try{
        const dataUrl = await fileToResizedDataURL(file);
        state.parsed.preguntas.find(x=>x.id===id).imagen = dataUrl;
      }catch(e){ toast('No se pudo cargar la imagen.'); }
      render();
    },
    removeQuestionImage(id){
      state.parsed.preguntas.find(x=>x.id===id).imagen = null;
      render();
    },
    moveItem(idx, dir){
      const items = state.parsed.items;
      const j = idx + dir;
      if(j<0 || j>=items.length) return;
      [items[idx], items[j]] = [items[j], items[idx]];
      render();
    },

    async saveExamNow(){
      const p = state.parsed;
      if(!p.titulo.trim() || !p.curso.trim()){ toast('Completa título y curso.'); return; }
      if(!p.preguntas.length){ toast('Agrega al menos una pregunta antes de guardar.'); return; }
      const incompletas = p.preguntas.filter(q => (q.tipo!=='abierta' && !q.correcta) || (q.tipo==='abierta' && (!q.aceptadas||!q.aceptadas.length)));
      if(incompletas.length){ toast(incompletas.length+' pregunta(s) sin respuesta correcta definida. Se guardarán como no calificables.'); }
      const codigo = genCode();
      const exam = {
        codigo, titulo:p.titulo.trim(), curso:p.curso.trim(),
        preguntas:p.preguntas, bloques:p.bloques, items:p.items,
        tiempoLimite: p.tiempoLimite||0, aleatorio: !!p.aleatorio, bloqueoPestana: p.bloqueoPestana!==false,
        docente: state.teacherName, createdAt: Date.now()
      };
      await saveExam(exam);
      state.savedCode = codigo;
      state.parsed = null;
      state.teacherTab = 'examenes';
      toast('Examen guardado. Código: '+codigo);
      await this.refreshExamList();
    },

    async viewResultados(codigo, titulo){
      state.resultView = {examCodigo:codigo, examTitulo:titulo};
      state.teacherTab='resultados';
      state.resultList = await listResultados(codigo);
      render();
    },

    showConfirm(title, message, callback){
      state.confirmModal = { title, message, callback };
      render();
    },
    confirmYes(){
      const cb = state.confirmModal && state.confirmModal.callback;
      state.confirmModal = null;
      render();
      if(cb) cb();
    },
    confirmNo(){
      state.confirmModal = null;
      render();
    },

    deleteExam(codigo, titulo){
      this.showConfirm(
        'Eliminar examen',
        '¿Eliminar "'+titulo+'" (código '+codigo+') y todos sus resultados? Esta acción no se puede deshacer.',
        async () => {
          toast('Eliminando examen…');
          await deleteExamAndResults(codigo);
          toast('Examen eliminado');
          await this.refreshExamList();
        }
      );
    },

    setDbFiltro(v){ state.dbFiltro=v; render(); },

    setRespuesta(id, val){ state.respuestas[id]=val; },
    setRespuestaRadio(id, val){ state.respuestas[id]=val; render(); },

    async submitExam(auto, motivo){
      this.stopExamTimer();
      this.stopLockTimer();
      const exam = state.activeExam;
      const r = gradeExam(exam, state.respuestas);
      const resultado = {
        nombre: state.studentForm.nombre,
        grado: state.studentForm.grado,
        curso: exam.curso,
        examTitulo: exam.titulo,
        examCodigo: exam.codigo,
        correctas: r.correctas,
        total: r.total,
        nota: r.nota,
        motivo: motivo || 'normal',
        fecha: Date.now()
      };
      await saveResultado(resultado);
      // El espejo manual a Drive solo hace falta dentro de Claude.ai (donde window.storage es el
      // almacenamiento principal). Hospedado externamente, el propio Apps Script ya refleja
      // cada resultado en el Sheet del curso automáticamente al guardarlo (ver DB.set).
      if(window.storage){
        syncResultToDrive(resultado).catch(()=>{});
      }
      state.lastResult = r;
      state.lastMotivo = motivo || 'normal';
      state.view='studentResult';
      render();
    },

    exportExam(codigo){
      listResultados(codigo).then(list=>{
        if(!list.length){ toast('Sin resultados para exportar todavía.'); return; }
        const rows = list.map(r=>({
          'Nombre completo': r.nombre, 'Grado': r.grado, 'Curso': r.curso,
          'Examen': r.examTitulo, 'Correctas': r.correctas, 'Total preguntas': r.total,
          'Calificación (1-5)': r.nota, 'Fecha': new Date(r.fecha).toLocaleString()
        }));
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Resultados');
        XLSX.writeFile(wb, 'resultados_'+codigo+'.xlsx');
      });
    },

    exportDb(){
      const rows = (state.dbFiltro==='Todos' ? state.dbData : state.dbData.filter(r=>r.curso===state.dbFiltro))
        .map(r=>({
          'Nombre completo': r.nombre, 'Grado': r.grado, 'Curso': r.curso,
          'Examen': r.examTitulo, 'Calificación (1-5)': r.nota, 'Fecha': new Date(r.fecha).toLocaleString()
        }));
      if(!rows.length){ toast('Sin datos para exportar.'); return; }
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Base de datos');
      XLSX.writeFile(wb, 'base_datos_'+(state.dbFiltro==='Todos'?'general':state.dbFiltro)+'.xlsx');
    },

    // ---- Recursos ----
    openResources(){ state.resourcesOpen=true; render(); },
    closeResources(){ state.resourcesOpen=false; render(); },
    setResourceTab(tab){ state.resourceTab=tab; render(); },
    setPtSearch(v){ state.ptSearch=v; render(); },
    selectElement(z){ state.selectedElement=z; render(); },

    calcSetDeg(deg){ state.calc.deg=deg; render(); },
    calcPress(token){
      const c = state.calc;
      if(token==='AC'){ c.expr=''; c.result=null; render(); return; }
      if(token==='DEL'){ c.expr=c.expr.slice(0,-1); render(); return; }
      if(token==='='){ this.calcEquals(); return; }
      c.expr += token;
      render();
    },
    calcEquals(){
      const c = state.calc;
      try{
        const val = safeCalcEval(c.expr, c.deg);
        c.result = (typeof val==='number' && isFinite(val)) ? +val.toFixed(8) : 'Error';
      }catch(e){
        c.result = 'Error';
      }
      render();
    }
  };

  function safeCalcEval(expr, deg){
    let cleaned = expr.replace(/\s+/g,'');
    if(!cleaned) return 0;
    // abrir/cerrar paréntesis pendientes
    const opens = (cleaned.match(/\(/g)||[]).length;
    const closes = (cleaned.match(/\)/g)||[]).length;
    for(let i=0;i<opens-closes;i++) cleaned += ')';
    // solo se permiten estos caracteres/palabras
    const whitelist = /^[0-9+\-*/().%^]|sin|cos|tan|log|ln|sqrt|pi|e/;
    if(!/^[0-9+\-*/().%^a-z]*$/i.test(cleaned)) throw new Error('bad');
    const stripped = cleaned.replace(/sin|cos|tan|log|ln|sqrt|pi|e/g,'');
    if(/[a-z]/i.test(stripped)) throw new Error('bad'); // quedó alguna letra no permitida

    const sin = x => deg ? Math.sin(x*Math.PI/180) : Math.sin(x);
    const cos = x => deg ? Math.cos(x*Math.PI/180) : Math.cos(x);
    const tan = x => deg ? Math.tan(x*Math.PI/180) : Math.tan(x);
    const log = x => Math.log10(x);
    const ln = x => Math.log(x);
    const sqrt = x => Math.sqrt(x);
    const pi = Math.PI, e = Math.E;

    const jsExpr = cleaned.replace(/\^/g,'**').replace(/%/g,'/100');
    return Function('sin','cos','tan','log','ln','sqrt','pi','e', `"use strict"; return (${jsExpr});`)(sin,cos,tan,log,ln,sqrt,pi,e);
  }

  document.addEventListener('visibilitychange', function(){
    if(document.hidden && state.view==='studentExam' && state.activeExam && state.activeExam.bloqueoPestana){
      AV.registerTabViolation();
    }
  });

  render();
})();
</script>
